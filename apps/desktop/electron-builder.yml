# electron-builder 配置
#
# 发布通道：安装包与 latest.yml 由 deploy.sh 上传到 VPS 的
# /srv/mcsr-helper/releases/，再由 Caddy 从 /installer/* 提供。
# 为什么暂时不用 R2，见下面 publish 那段。

appId: com.mcsr.helper
productName: MCSR Helper
copyright: Copyright © 2026 MCSR Helper

directories:
  output: release
  buildResources: build

files:
  - dist/**/*
  - package.json
  - '!**/*.map'
  - '!**/node_modules/**/{test,__tests__,tests,example,examples,docs,doc}/**'

win:
  target:
    - target: nsis
      arch: [x64]
  # 未购买代码签名证书时保持为 null（见 docs/v1-plan.md §6）。
  # 代价：用户首次运行会遇到 SmartScreen「未知发布者」提示。
  # 买入 OV 证书后把证书路径写到这里即可，无需改其他配置。
  signAndEditExecutable: true

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: MCSR Helper
  deleteAppDataOnUninstall: false
  artifactName: ${productName}-Setup-${version}.${ext}

# 自动更新源。
#
# ⚠️ 现在走**自己的 VPS**（Caddy 的 /installer/* → /srv/mcsr-helper/releases/），
#    而不是计划里写的 Cloudflare R2。原因是 R2 需要你先去开桶，
#    而 M3 的验收标准（发新版本 → 应用内提示 → 更新成功）用任何静态托管都能验。
#
# 代价是大陆用户下载 ~100MB 会走跨境链路，实测可能只有几百 KB/s。
# 这在 M3 阶段可以接受（我们自己测），但**面向真实用户之前应该换成 R2**。
#
# 什么时候换：拿到 R2 桶之后，把 url 改成
#     https://<R2_PUBLIC_HOST>/mcsr-helper/releases
# 并恢复 deploy/Caddyfile 里那段被注释掉的 /installer/* 跳转。
# **只需要改这两处，客户端不用重新发版** —— electron-updater 的地址是
# 从打包进去的 app-update.yml 读的，所以换源要发一个新版本才生效；
# 但旧版本会一直用旧地址，直到它更新到那个新版本为止。
# 这也是为什么换源要趁早：越晚换，停留在旧源上的用户越多。
publish:
  provider: generic
  url: https://mcsrhelper.com/installer
  channel: latest
