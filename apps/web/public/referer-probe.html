<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!--
      和主站相同的策略。这个探针唯一的目的是证明浏览器**没有压制** Referer ——
      而这一点决定了 YouTube 嵌入播放器能否工作（缺失会产生
      "Error 153: Video player configuration error"）。

      同源 iframe 会收到完整来源 URL，跨域只会收到 origin。两种都必须非空。
      这里是空的 = YouTube 和 Twitch 都会失败。
    -->
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <title>referer probe</title>
    <style>
      body {
        margin: 0;
        padding: 10px 12px;
        background: #12141a;
        color: #e8eaef;
        font: 12px/1.6 ui-monospace, Consolas, monospace;
      }
      pre {
        margin: 0;
        white-space: pre-wrap;
        word-break: break-all;
      }
      .ok {
        color: #5ee08a;
      }
      .bad {
        color: #ff6b6b;
      }
    </style>
  </head>
  <body>
    <pre id="out">measuring…</pre>
    <script>
      /*
       * ⚠️ 全部**同步**执行，不要放进 Promise/回调里。
       *
       * 第一版把这个写进了 fetch().then()，结果父页面在 iframe 的 load 事件里
       * 读到的永远是空值 —— load 早于异步回调执行，于是报出
       * "❌ 浏览器没有发送 Referer" 的假阴性（而 YouTube 其实播得好好的）。
       *
       * document.referrer 本来就是同步可用的，没有任何理由延后读取。
       */
      (function () {
        var ref = document.referrer;
        var policy = document.referrerPolicy || '(unset)';

        document.body.dataset.referer = ref;
        document.body.dataset.suppressed = ref ? 'false' : 'true';

        var el = document.getElementById('out');
        el.textContent =
          'document.referrer = ' + (ref || '(EMPTY -- referrers are suppressed!)') + '\n' +
          'location.origin   = ' + location.origin + '\n' +
          'referrerPolicy    = ' + policy;
        el.className = ref ? 'ok' : 'bad';

        // 主动上报给父页面 —— 不依赖父页面读取时机，也不依赖同源 DOM 访问。
        try {
          parent.postMessage({ type: 'mcsr-referer-probe', referer: ref, policy: policy }, '*');
        } catch (e) {
          /* 忽略 */
        }
      })();
    </script>
  </body>
</html>
